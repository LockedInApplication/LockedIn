version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: lockedin-postgres
    restart: always
    environment:
      POSTGRES_DB: LockedIn
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: mysecret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: lockedin-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lockedin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: